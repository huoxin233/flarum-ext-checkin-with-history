name: Check-in with History JS

on: [workflow_dispatch, push, pull_request]

jobs:
  run:
    uses: flarum/framework/.github/workflows/REUSABLE_frontend.yml@1.x
    with:
      enable_bundlewatch: false
      enable_prettier: true
      enable_typescript: true
      build_typings_script: ''
      type_coverage_script: ''

      frontend_directory: ./js
      backend_directory: .
      js_package_manager: npm
      main_git_branch: main
      git_actor_name: primexcalibur
      git_actor_email: 269682658+primexcalibur@users.noreply.github.com

    secrets:
      bundlewatch_github_token: ${{ secrets.BUNDLEWATCH_GITHUB_TOKEN }}
